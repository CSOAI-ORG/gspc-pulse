name: gspc-pulse-watcher

# Independent public-surface pulse watcher. Exit 2 means no frozen delta,
# which is an expected successful no-op, not a failed workflow.
# ci_pulse.py is the current writer: trending + 30-day new-with-traction,
# plus KEV, MCP and x402 source observations. Do not use legacy node_runner.

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gspc-pulse-watcher
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pulse (frozen-gated append)
        id: pulse
        shell: bash
        run: |
          set +e
          python ci_pulse.py
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "changed=true" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "No frozen change; successful no-op."
              ;;
            *)
              echo "Pulse failed with exit code $rc"
              exit "$rc"
              ;;
          esac
      - name: Rebuild and validate derived reporting
        if: \${{ fromJSON(steps.pulse.outputs.changed) }}
        run: |
          python lane_reports.py
          python lane_reports.py --validate
      - name: Install signature verification dependency
        run: python -m pip install --disable-pip-version-check --quiet cryptography
      - name: Verify signed prefix before commit
        run: python pulse_freeze.py verify
      - name: Commit frozen deltas and derived surfaces
        if: \${{ fromJSON(steps.pulse.outputs.changed) }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Non-main ref validated; no write to main."
            exit 0
          fi
          git config user.name "gspc-pulse-bot"
          git config user.email "agents@csoai.org"
          git add pulse.jsonl timeseries.csv feed.json latest.json llms.txt index.html
          git add alerts.jsonl REPORT.md packs/ dashboard.html RECONCILIATION.md verification-log.jsonl
          if git diff --cached --quiet; then
            echo "no changed pulse outputs — nothing to commit"
          else
            git commit -m "Agent: current GSPC pulse and derived evidence"
            git fetch origin main
            git -c rebase.autoStash=true rebase origin/main
            git push origin HEAD:main
          fi
      - name: Publish Hugging Face dataset mirror
        if: ${{ env.HF_TOKEN != '' && github.ref == 'refs/heads/main' }}
        run: |
          python -m pip install --disable-pip-version-check --quiet huggingface_hub pyyaml
          python ci/hf_dataset_mirror.py --publish
      - name: Report skipped Hugging Face mirror
        if: ${{ env.HF_TOKEN == '' && github.ref == 'refs/heads/main' }}
        run: echo "HF_TOKEN is not configured; Hugging Face mirror was not published."
